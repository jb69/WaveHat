; WaveHat firmware: one environment per Seeed XIAO.
;
;   pio run                  # build all three
;   pio run -e xiao_c3 -t upload -t monitor
;
; Platform: pioarduino (Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5), which SensESP 3
; recommends and which is the only PlatformIO platform that supports the C6.

[platformio]
default_envs = xiao_c3, xiao_c6, xiao_s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    SignalK/SensESP @ ~3.6.0
    ; ESP-IDF 5 no longer bundles the websocket client SensESP uses
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D USE_ESP_IDF_LOG
    -D SENSESP_SSL_SUPPORT=1
    ; USB-CDC as the serial console on all three XIAOs
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; The first delta after connecting carries the metadata of all five paths
    ; (~1.9 kB); SensESP's default 1024-byte buffer drops it (REVIEW.md G8)
    -D SENSESP_SK_WS_BUFFER_SIZE=4096
build_unflags =
    -Werror=reorder
; Two app slots for over-the-air updates (the box is sealed)
board_build.partitions = min_spiffs.csv

[env:xiao_c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -D WAVEHAT_BOOT_BUTTON=9

[env:xiao_c6]
board = seeed_xiao_esp32c6
build_flags =
    ${env.build_flags}
    -D WAVEHAT_BOOT_BUTTON=9

[env:xiao_s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D WAVEHAT_BOOT_BUTTON=0

; Bench check of the NMEA 2000 listener on a bare XIAO C3, no bus or transceiver needed:
; the CAN controller loops back inside the chip and feeds itself made-up frames (n2k_bus.h).
; The status page's "NMEA 2000" line should count frames and show SOG ramping 0-11.7 kn.
; Not for a board on a real bus: this build transmits.
[env:xiao_c3_n2k_selftest]
extends = env:xiao_c3
build_flags =
    ${env:xiao_c3.build_flags}
    -D WAVEHAT_N2K_SELFTEST

; End-to-end check without an IMU: a simulated sea (0.50 m heave at 8.0 s, so Hs 1.41 m,
; Tp = Tz = 8.0 s) and a scripted SOG (anchored, motoring 25-45 min, anchored), run 8 times
; faster than real time, through the real wave maths, Signal K output, log and bridge.
; README.md, "Simulated IMU". Not for a boat.
[env:xiao_c3_sim_imu]
extends = env:xiao_c3
build_flags =
    ${env:xiao_c3.build_flags}
    -D WAVEHAT_SIM_IMU=8
